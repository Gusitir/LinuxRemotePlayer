# ==============================================================================
# preseed.cfg — LRP OS Automated Unattended Debian Installer Configuration
# ==============================================================================

# --- Localization & Regional Settings ---
d-i debian-installer/locale string es_ES.UTF-8
d-i localechooser/supported-locales multiselect es_ES.UTF-8, en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select es
d-i console-setup/ask_detect boolean false
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Network Configuration ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string lrp-appliance
d-i netcfg/get_domain string local
d-i netcfg/wireless_wep string

# --- Mirror Settings (Debian 13 Trixie / Stable) ---
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Account Setup (Non-root user 'lrp') ---
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Linux Remote Player
d-i passwd/username string lrp
d-i passwd/user-password password lrp
d-i passwd/user-password-again password lrp
d-i passwd/user-default-groups string sudo audio video input render netdev dialout

# --- Automated Disk Partitioning (GPT / EFI + Root) & Fail-Closed USB Exclusion ---
# Excludes source medium mounted on /run/live/medium, /cdrom, /live/image or boot USB transport
d-i partman/early_command string \
    LIVE_SRC=$(mount | grep -E '(/run/live/medium|/cdrom|/live/image)' | awk '{print $1}' | head -n1 | sed -E 's/[0-9]+$//; s/p[0-9]+$//'); \
    TARGET_DISK=$(for d in $(list-devices disk 2>/dev/null || ls /dev/sd[a-z] /dev/nvme[0-9]n[0-9] 2>/dev/null); do \
        [ "$d" = "$LIVE_SRC" ] && continue; \
        if [ -d "/sys/block/$(basename "$d")" ] && udevadm info --query=property --name="$d" 2>/dev/null | grep -q "ID_BUS=usb"; then continue; fi; \
        echo "$d"; break; \
    done); \
    if [ -n "$TARGET_DISK" ]; then \
        debconf-set partman-auto/disk "$TARGET_DISK"; \
    else \
        debconf-set partman-auto/disk "/dev/disk/by-id/safety-fail-closed-no-valid-target"; \
    fi
d-i partman-auto/disk string auto
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/mount_style select label

# --- Package Selection & Tasks ---
tasksel tasksel/first multiselect standard
d-i pkgsel/include string xorg openbox lightdm lightdm-gtk-greeter firefox-esr \
    pipewire pipewire-audio wireplumber libasound2-plugins \
    network-manager bluez avahi-daemon sudo curl rsync \
    systemd-zram-generator zram-tools zstd \
    python3 python3-venv python3-pip libuinput1 libcurl4 \
    i965-va-driver-shaders intel-media-va-driver-shaders mesa-va-drivers
d-i pkgsel/upgrade select safe-upgrade
popularity-contest popularity-contest/participate boolean false

# --- Bootloader Installation ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# --- Post-Installation Late Command ---
d-i preseed/late_command string \
    in-target mkdir -p /etc/lightdm/lightdm.conf.d; \
    echo "[Seat:*]\nautologin-user=lrp\nautologin-user-timeout=0\nuser-session=openbox" > /target/etc/lightdm/lightdm.conf.d/80-lrp-autologin.conf; \
    echo "lrp ALL=(ALL) NOPASSWD:ALL" > /target/etc/sudoers.d/99-lrp-user; \
    chmod 0440 /target/etc/sudoers.d/99-lrp-user; \
    mkdir -p /target/etc/systemd; \
    echo -e "[zram0]\nzram-size = min(ram / 2, 4096)\ncompression-algorithm = zstd\nswap-priority = 100\nfs-type = swap" > /target/etc/systemd/zram-generator.conf

# --- Completion & Reboot ---
d-i finish-install/reboot_in_progress note
