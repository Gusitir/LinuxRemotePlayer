# /boot/grub/grub.cfg — LRP OS ISO Boot Menu
set default="0"
set timeout=3

# Visual theme and resolution
set gfxmode=auto
insmod all_video
insmod gfxterm
terminal_output gfxterm

menuentry "Instalar LRP OS (Automático / Desatendido)" --class debian --class gnu-linux {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 lrp_auto_install
    initrd /live/initrd.img
}

menuentry "LRP OS Live (Probar en memoria sin instalar)" --class debian --class gnu-linux {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3
    initrd /live/initrd.img
}

menuentry "LRP OS Live (Modo Seguro - Gráficos Básicos nomodeset)" --class debian --class gnu-linux {
    linux /live/vmlinuz boot=live components nomodeset
    initrd /live/initrd.img
}
