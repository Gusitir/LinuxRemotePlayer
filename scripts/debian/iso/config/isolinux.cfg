# /isolinux/isolinux.cfg — LRP OS BIOS Boot Menu
UI vesamenu.c32
PROMPT 0
TIMEOUT 30

MENU TITLE LRP OS Appliance — Boot Menu
MENU DEFAULT lrp-install

LABEL lrp-install
    MENU LABEL Instalar LRP OS (Automatico / Desatendido)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash loglevel=3 lrp_auto_install

LABEL lrp-live
    MENU LABEL LRP OS Live (Probar sin instalar)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components quiet splash loglevel=3

LABEL lrp-safe
    MENU LABEL LRP OS Live (Modo Seguro - nomodeset)
    KERNEL /live/vmlinuz
    APPEND initrd=/live/initrd.img boot=live components nomodeset
