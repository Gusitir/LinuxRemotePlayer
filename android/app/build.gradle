plugins {
    id 'com.android.application'
}

// La firma vive FUERA del repo: keystore.properties (no versionado) apunta al keystore.
// Si el archivo no existe, el release se compila sin firmar (app-release-unsigned.apk).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def hasKeystore = keystorePropertiesFile.exists()
def keystoreProperties = new Properties()
if (hasKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.gusitir.lrp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gusitir.lrp'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    if (hasKeystore) {
        signingConfigs {
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
