<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="lrp-icon-title">
  <title id="lrp-icon-title">LinuxRemotePlayer</title>
  <!-- Logo "Touchpad": el pad de puntos ES el mando. Paleta del sitio web:
       crema #F6F2EA, tinta #292319, verde de marca. El pad redondeado cabe
       dentro del safe zone maskable (r<=204.8 desde el centro): la esquina
       más lejana queda a 199.6. -->
  <defs>
    <clipPath id="lrp-pad">
      <rect x="92" y="92" width="328" height="328" rx="78"/>
    </clipPath>
    <pattern id="lrp-dots" width="41" height="41" patternUnits="userSpaceOnUse" x="92" y="92">
      <circle cx="20.5" cy="20.5" r="5" fill="#F6F2EA" opacity="0.20"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="114" fill="#F6F2EA"/>
  <rect x="92" y="92" width="328" height="328" rx="78" fill="#292319"/>
  <rect x="92" y="92" width="328" height="328" fill="url(#lrp-dots)" clip-path="url(#lrp-pad)"/>
  <path d="M323 256 L205 186 L205 326 Z" fill="#3E9E63" stroke="#3E9E63" stroke-width="30" stroke-linejoin="round"/>
</svg>
